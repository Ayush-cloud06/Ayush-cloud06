# Builds the Stufe desktop app (german-a2/) for Windows, Linux and macOS.
# Manual only. Installers are uploaded as workflow artifacts; no GitHub release is created.
name: Stufe desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: german-a2

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: german-a2/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: german-a2/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and validate
        run: |
          npm run validate:content
          npm test

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: german-a2
          # No tagName / releaseId: build only, do not create a GitHub release.

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: stufe-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            german-a2/src-tauri/target/release/bundle/msi/*.msi
            german-a2/src-tauri/target/release/bundle/nsis/*.exe
            german-a2/src-tauri/target/release/bundle/deb/*.deb
            german-a2/src-tauri/target/release/bundle/rpm/*.rpm
            german-a2/src-tauri/target/release/bundle/appimage/*.AppImage
            german-a2/src-tauri/target/release/bundle/dmg/*.dmg
